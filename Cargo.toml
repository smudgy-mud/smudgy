[workspace]
members = ["ui", "core", "cloud", "i18n", "map_widget", "bench", "script", "inspector"]
# Everything except `inspector` and `scriptref`. This leaves exactly one bin target (ui's
# `smudgy`) in the default set, so a bare `cargo run` / `cargo build` / `cargo
# test` resolves to the app without needing `-p` or `--bin`. `inspector` is a
# standalone dev/sidecar helper with its own bin (`smudgy_inspector`); a second
# default bin would make `cargo run` ambiguous, so it's excluded here. Build or
# lint it explicitly with `-p smudgy_inspector`, or include it via
# `cargo build --workspace`; release.ps1 builds it explicitly for packaging.
# `scriptref` (`smudgy_scriptref`) is likewise a standalone dev tool — the script
# API reference generator/publisher — excluded for the same reason; run it with
# `cargo run -p smudgy_scriptref`.
default-members = ["ui", "core", "cloud", "map_widget", "bench", "script"]
resolver = "2"

# Define shared dependencies for the workspace
[workspace.dependencies]
color-art = "0.3.0"
arc-swap = { version = "1.7.1", features = ["weak"] }
anyhow = "1.0.98"
iced = { version = "0.14", features = [
    "tokio",
    "svg",
    "web-colors",
    "highlighter",
    "advanced",
    "canvas",
    "markdown",
    # The image widget/pipeline WITHOUT `image/default`'s every-codec pull — the workspace
    # `image` dep below selects exactly the codecs smudgy decodes (the smudgy_ui image
    # fetcher pre-decodes to RGBA, so iced itself never runs a codec; see the Image plan).
    "image-without-codecs",
] }
# Raster decoding for the script-facing <Image> widget: the ui fetcher decodes off-thread
# (with `image::Limits`) to RGBA handles. `default-features = false` + explicit codecs keeps
# the binary lean; feature-unifies with the copy deno_image already pulls.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
] }
# EXIF orientation for pre-decoded images: iced applies EXIF only in its own decode path,
# and RGBA handles bypass it, so the fetcher must orient explicitly. Same version
# iced_graphics's `image` feature pins.
kamadak-exif = "0.6"
# Windows-sane fs::canonicalize (no \\?\ verbatim prefixes) for image-asset root
# confinement checks in the ui fetcher.
dunce = "1"
iced_anim = "0.3.1"
iced_runtime = "0.14"
# Pluggable span/metrics API (comet). A no-op unless the app is built with smudgy_ui's
# `iced-debug` feature, whose `iced/debug` unifies `iced_debug/enable` workspace-wide.
iced_debug = "0.14"
derive_more = { version = "2.0.1", features = [
    "display",
    "from",
    "into",
    "add",
] }
dirs = "6.0.0"
chrono = "0.4.41"
serde = { version = "1.0.219", features = ["derive"] }
# `preserve_order` (maps back onto IndexMap) is a session-store requirement: store values
# keep object entry order as published, and JS object property order is insertion order —
# so serde round-trips through ops stay faithful to what scripts wrote.
serde_json = { version = "1.0.140", features = ["preserve_order"] }
# The session store's value tree (`smudgy_cloud::store_node`) keys objects by folded key in
# publish order — the same ordered-map semantics `preserve_order` gives serde_json above.
indexmap = "2"
validator = { version = "0.20.0", features = ["derive"] }
cfg-if = "1.0.0"
futures = "0.3"
regex = "1"
regex-filtered = "0.2"
regex-syntax = "0.8"
aho-corasick = "1.1"
ordered-float = { version = "4.0", default-features = false }
smudgy_core = { path = "./core" }
smudgy_script = { path = "./script" }
smudgy_theme = { path = "./theme" }
smudgy_cloud = { path = "./cloud", features = ["cloud"] }
smudgy_widgets = { path = "./widgets" }
smudgy_map_widget = { path = "./map_widget" }
smudgy_i18n = { path = "./i18n" }
tokio = { version = "1.44.2", features = ["full"] }
parking_lot = "0.12.1"
pretty_env_logger = "0.5.0"
# `release_max_level_info` statically strips `debug!`/`trace!` (and any work gated on
# `log_enabled!(Debug)`, e.g. the per-line trigger-match timers) from release and bench
# builds — info and above only. Dev builds keep every level and filter at runtime:
# `SMUDGY_LOG` defaults to `debug` there, so the telnet negotiation transcript and the
# trigger timing lines print to the dev console; `SMUDGY_LOG=info` quiets them.
log = { version = "0.4.27", features = ["release_max_level_info"] }
vtparse = "0.7.0"
# Embedded Deno v2.9.5 crate family, frozen from the official latest-stable endpoint on
# 2026-08-16. deno_core is workspace-wide because core + smudgy_widgets also use it directly
# (`links = "v8"` forbids two versions). The engine path is deno_core 0.410 -> deno_v8 0.2 ->
# rusty_v8 150.4; keep the V8 backend and do not enable deno_v8's experimental `quickjs` feature.
deno_core = { version = "0.410", features = [
    "unsafe_use_unprotected_platform",
] }
pathfinding = "4.14.0"
deno_error = "=0.7.1"
# Windows UI platform calls: the Restart Manager window-proc subclass
# (ui/src/win_rm.rs — commctrl/winuser, WM_ENDSESSION handling) and
# virtual-screen metrics for workspace restore (ui/src/workspace/restore.rs).
# The ui crate declares the feature set it needs at its own dependency entry.
winapi = "0.3.9"
build-time = "0.1.3"
fluent-bundle = "0.16.0"
sys-locale = "0.3.2"
unic-langid = "0.9.6"

# Source patches managed by patch-crate (https://crates.io/crates/patch-crate).
# After a fresh clone (or a `cargo clean`), run `cargo install patch-crate &&
# cargo patch-crate` once to materialize target/patch/ before building.
#
# - `iced_graphics` (patches/iced_graphics+0.14.0.patch): runtime per-family
#   OpenType feature control that upstream iced lacks — the terminal opts its
#   font family out of ligatures (liga/clig/calt/dlig), which break monospace
#   column alignment, while UI text keeps them.
# - `cosmic-text` (patches/cosmic-text+0.15.0.patch): variable faces are
#   accepted at every requested weight covered by their `wght` axis (backport
#   of upstream pop-os/cosmic-text#486). Also, upstream's `monospace_fallback`
#   machinery only engages for the generic
#   `Family::Monospace` request, which iced never issues (it always names a
#   concrete family). The patch appends Monospace as a second default family
#   whenever the named primary resolves to a monospace face, so missing
#   glyphs fall back to coverage-ranked monospace candidates instead of the
#   proportional script/common lists.
# - `vtparse` (patches/vtparse+0.7.0.patch): bounds the std/alloc OSC and APC
#   string buffers so hostile peers cannot grow them without limit.
# - `deno_permissions` (patches/deno_permissions+0.116.0.patch): adds a host-only
#   any-host network descriptor so package manifests can express `*` (any internet
#   host/port) and `*:port` (any internet host on one port) consistently without
#   granting Unix-domain or VSock transports. Also exempts Windows pipe-namespace
#   query paths (`\\.\pipe\<name>`) from the special-file all-permissions demand so
#   scoped read+write grants can reach them; paired invariant: smudgy rejects
#   pipe-namespace paths in manifest path axes, so a pipe fs-grant only ever
#   originates from a consented Critical-tier `ipc` row.
[workspace.metadata.patch]
crates = ["iced_graphics", "cosmic-text", "vtparse", "deno_permissions"]

[patch.crates-io]
iced_graphics = { path = "./target/patch/iced_graphics-0.14.0" }
cosmic-text = { path = "./target/patch/cosmic-text-0.15.0" }
vtparse = { path = "./target/patch/vtparse-0.7.0" }
deno_permissions = { path = "./target/patch/deno_permissions-0.116.0" }

# Define workspace-wide lints
[workspace.lints.clippy]
pedantic = "warn"
[profile.profiling]
inherits = "release"
debug = true

[profile.release-full]
inherits = "release"
lto = true
