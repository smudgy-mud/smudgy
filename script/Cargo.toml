[package]
name = "smudgy_script"
description = "Smudgy's embedded JS/TS scripting runtime"
edition = "2021"
version = "0.5.4"
publish = false

# Thin runtime built directly on the Deno v2.9.5 crate family, targeting Deno parity
# (jsr/npm). Baseline frozen 2026-08-16. Version anchor:
#   deno_runtime 0.265 -> deno_core 0.410 -> deno_v8 0.2 -> v8 150.4;
#   deno_error 0.7.1 / deno_ast 0.53.3.
[lib]
doctest = false

[dependencies]
deno_core = { workspace = true }
deno_error = { workspace = true }
# The runtime boots from a real V8 startup snapshot: build.rs bakes the
# deno_runtime base extension set (deno_core 0.410 records every extension JS
# source as an absolute build-machine path — `LoadedFromFsDuringSnapshot` — so
# without a snapshot, a distributed binary fails every JsRuntime::new with
# os error 3; the v0.5.4 hotfix patched the sources back to embedded instead).
# smudgy's own extensions (smudgy_ops / smudgy_mapper / smudgy_widgets) stay
# OUTSIDE the snapshot — they carry per-session state and live above this
# crate — and embed their ESM via each `extension!`'s customizer.
#
# NB: still do NOT enable "hmr" here: it flips lazy sources back to
# disk-at-runtime paths. `snapshot` gates both `transpile` and the
# `deno_runtime::snapshot` module build.rs uses.
deno_runtime = { version = "0.265", features = ["snapshot"] }
# `cjs` (+ its implied `utils`) powers npm CJS->ESM interop: analyze_cjs names a
# CommonJS module's exports so they surface as ESM named exports, and
# analyze_es_runtime_exports covers ESM files re-exported through CJS.
deno_ast = { version = "=0.53.3", features = ["transpiling", "cjs"] }
deno_fetch = "0.281"
deno_fs = "0.167"
deno_node = "0.195"
deno_npm = "0.69"
deno_npm_cache = "0.76"
deno_npmrc = "0.18"
deno_permissions = "0.116"
deno_web = "0.288"
deno_resolver = "0.88"
deno_semver = "0.10.1"
deno_cache_dir = "0.49"
deno_config = "0.107"
deno_maybe_sync = "0.44"
node_resolver = "0.95"
sys_traits = "0.1.28"
async-trait = "0.1"
# rustls 0.23 needs an explicit process-global CryptoProvider installed before any
# TLS use; deno_tls (Deno.connectTls / https) uses aws-lc-rs. We install it in
# ScriptRuntime::new. (rustls default features include the aws_lc_rs provider.)
rustls = "0.23"
anyhow = { workspace = true }
log = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", features = ["blocking", "json"] }

[dev-dependencies]
tempfile = "3"

# build.rs creates the V8 startup snapshot (deno_runtime base extension set) at
# compile time and emits the residual lazy-source table; see build.rs. Resolved
# for the HOST (resolver 2 keeps its features separate from the target graph).
[build-dependencies]
deno_runtime = { version = "0.265", features = ["snapshot"] }
# deno_runtime declares deno_core with default-features = false and leaves the
# engine-backend choice to the embedder (the workspace's direct deno_core dep
# does that for the target graph). Default features here = the V8 backend.
deno_core = "0.410"
