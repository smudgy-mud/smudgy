[package]
name = "smudgy_widgets"
version = "0.5.9-ptb"
edition = "2024"

[dependencies]
arc-swap = { workspace = true }
# Terminal graphics pixels arrive as `Bytes` and become an image handle without a copy.
# Same major iced and smudgy_protocol use.
bytes = "1"
deno_core = { workspace = true }
deno_error = { workspace = true }
tokio = { workspace = true }
smudgy_session_model = { workspace = true }
# Kitty graphics placements: the inline-object resource the placement widget draws.
smudgy_protocol = { workspace = true }
smudgy_ui_shared = { workspace = true }
smudgy_theme = { workspace = true }
smudgy_map_widget = { workspace = true }
smudgy_cloud = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
iced = { workspace = true }
iced_debug = { workspace = true }
log = { workspace = true }
thiserror = "2.0.12"
# Same version iced's `markdown` feature pulls in, so command-autolink detection tokenizes
# identically to iced's own parse (see `expand_command_autolinks`).
pulldown-cmark = "0.12"

[lints]
workspace = true
