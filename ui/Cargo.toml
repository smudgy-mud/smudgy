[package]
name = "smudgy_ui"
version = "0.5.7-ptb3"
edition = "2024"
build = "build.rs"

# The crate stays `smudgy_ui` (its name across the workspace), but the shipped
# executable is just `smudgy.exe` — that's what users launch and what the
# installer installs. Run it during dev with `cargo run` (the workspace's
# default-members make `cargo run` resolve to this binary; see ../Cargo.toml).
[[bin]]
name = "smudgy"
path = "src/main.rs"

[dependencies]
smudgy_core = { workspace = true }
smudgy_script = { workspace = true }
smudgy_cloud = { workspace = true }
smudgy_theme = { workspace = true }
smudgy_map_widget = { workspace = true }
smudgy_i18n = { workspace = true }
sys-locale = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
iced = { workspace = true }
iced-code-editor = { workspace = true }
iced_anim = { workspace = true }
iced_runtime = { workspace = true }
# The (patch-crate patched) shaping registry: the terminal font family opts out
# of ligatures at shaping time (see patches/iced_graphics+0.14.0.patch and the
# workspace manifest's [workspace.metadata.patch] note). Same version iced pins,
# so it resolves to the single patched copy.
iced_graphics = "0.14"
log = { workspace = true }
smudgy_widgets = { workspace = true }
# Zero-copy upload of the CRT-cat shader's uniform block (see widgets/crt_cat.rs).
bytemuck = { version = "1", features = ["derive"] }
# Inline-capacity tab lists in the pane-group layout model (same version the
# rest of the tree already resolves to).
smallvec = "1"
# Stable-id side maps in the pane-group layout model (integer keys; same
# version smudgy_core already pins).
rustc-hash = "2"

validator.workspace = true
# Live pattern testing in the Automations window (alias/trigger testers).
regex = { workspace = true }
tokio.workspace = true
tokio-stream = "0.1.17"
arc-swap = { workspace = true }
chrono = { workspace = true }
# System font enumeration for the Preferences tab (same version cosmic-text
# already pins in Cargo.lock).
fontdb = "0.23"
# Not used directly — enables cosmic-text's `monospace_fallback` via feature
# unification on the copy iced_graphics links, so missing-glyph fallback in
# monospace text stays on monospace faces (matching advance width) instead of
# grabbing any face and wrecking terminal-grid column alignment.
cosmic-text = { version = "0.15", default-features = false, features = ["monospace_fallback"] }
# Open the download page in the system browser when the cloud reports this
# client is out of date (HTTP 426).
open = "5"
# Parse/compare the manifest version against published versions so the Publish button is
# semver-fluent (disable + explain when the version is invalid or already used).
semver = "1"
# Grapheme <-> UTF-16 conversion at the input-mirror boundary (scripts count
# UTF-16 code units; iced's text_input counts graphemes). Same version iced
# already pins in Cargo.lock.
unicode-segmentation = "1"
# --- <Image> widget loading (ui/src/images/) ---------------------------------------------
# The image fetcher: dedicated HTTP client (no default headers/cookies — the shared cloud
# client stamps a version header packages must not see), manual redirect following so every
# hop re-validates against a sandboxed package's net grants.
reqwest = { version = "0.12.8", default-features = true }
# Off-thread pre-decode with explicit `Limits` (decode bombs) + selected codecs (workspace dep).
image = { workspace = true }
# EXIF orientation for pre-decoded RGBA (iced applies EXIF only in its own decode path).
kamadak-exif = { workspace = true }
# Windows-sane canonicalize for the post-lexical asset-root confinement recheck.
dunce = { workspace = true }
# Content-addressed blob naming + HTTP-cache meta keys.
sha2 = "0.10"
# HTTP-cache metadata files (meta/<server>/<hash>.json).
serde = { workspace = true, features = ["derive"] }
# Redirect-hop URL handling in the HTTP cache (same major cloud uses).
url = "2"
# data: URI payloads. Same version already in the lock.
base64 = "0.22"
# HTTP date parsing (Expires/Last-Modified/Date) for the RFC-9111-subset freshness math.
httpdate = "1"
discord-rich-presence = "1.1.0"
smudgy_audio = { workspace = true, optional = true }
smudgy_audio_web = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

# Restart Manager cooperation so the installer can upgrade over a running smudgy:
# a window-proc subclass catches the session-end message and exits. See win_rm.rs.
[target.'cfg(windows)'.dependencies]
winapi = { workspace = true, features = [
    "commctrl",
    "winuser",
    "minwindef",
    "basetsd",
    "windef",
] }

[features]
# Desktop builds ship with physical Web Audio output by default. Embedders and
# hardware-free CI lanes opt out with --no-default-features; the hosted silent
# path remains fully supported there.
default = ["web-audio-cpal"]
# Hardware-independent integration for explicit audio-scoped test/embedding paths. It keeps
# `sinkId: "none"` available without acquiring a device; by itself it does not make ordinary
# desktop sessions audio-scoped.
web-audio = ["smudgy_core/web-audio"]
# Desktop coordinator and direct CPAL output (WASAPI/ALSA/CoreAudio) through
# `smudgy_audio/physical-output`. Production packaging still selects this
# feature explicitly, and it is also the crate default.
web-audio-cpal = [
    "web-audio",
    "dep:futures",
    "dep:smudgy_audio",
    "dep:smudgy_audio_web",
    "smudgy_audio/physical-output",
]
# Attach iced's devtools to the running app (iced_debug + the in-app overlay, plus the
# beacon a running `comet` viewer connects to). Dev-only instrumentation -- keep it out
# of release builds. Usage: cargo run --features iced-debug
iced-debug = ["iced/debug"]

[dev-dependencies]
async-trait = "0.1"
smudgy_audio = { workspace = true, features = ["test-support"] }
# Isolated on-disk fixtures for the workspace load/set-aside tests (same
# version core already pins).
tempfile = "3"

[build-dependencies]
winresource = "0.1.17"

[lints]
workspace = true 

[package.metadata.bundle]
name = "Smudgy"
identifier = "org.smudgy"
icon = ["../assets/icon256.png", "../assets/icon256@2x.png"]
