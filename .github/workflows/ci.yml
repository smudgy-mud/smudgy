name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  # CI never reads line numbers off a backtrace, and on Linux the debug info
  # dominates target/: DWARF is embedded in each of the ~50 integration-test
  # executables, every one of which statically links V8. macOS leaves it in the
  # .o files and Windows in separate .pdb, which is why the Linux runner is the
  # one that runs out of disk. `test` inherits `dev`, so this covers the test
  # binaries as well as the dependency graph under them.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  release-tooling:
    name: Release coordinator tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s bin/tests -v

  packages:
    name: Package tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `node --test` passes when its glob matches no files, so failglob makes a
    # moved or renamed suite fail its step instead of silently testing nothing.
    defaults:
      run:
        shell: bash -O failglob -e {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # The suites use node:test and Node's built-in TypeScript type stripping
      # and have no npm dependencies, so there is nothing to install or cache.
      - name: Install Node
        id: node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.1'

      # One step per package names the failing suite, and every suite runs
      # even after an earlier one fails, so one red package cannot hide another.
      - name: Test arctic-mapper
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: node --test packages/arctic-mapper/mapper/*.test.ts

      - name: Test calendar-todo-list
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: node --test packages/calendar-todo-list/test/*.test.ts

      - name: Test map-layout
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: node --test packages/map-layout/*.test.ts

      - name: Test mudlet-db
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: node --test packages/mudlet-db/test/*.test.ts

      - name: Test nukefire-mapper
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: node --test packages/nukefire-mapper/*.test.ts

      - name: Test nukefire-scripts
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: node --test packages/nukefire-scripts/*.test.ts

      - name: Test tintin-emulator
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: node --test packages/tintin-emulator/test/*.test.ts

  fmt:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install pinned Rust
        run: rustup toolchain install --no-self-update

      - name: Check formatting
        run: cargo fmt --all -- --check

  browser-e2e:
    name: Browser end-to-end
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install pinned Rust and browser target
        run: |
          rustup toolchain install --no-self-update
          rustup target add wasm32-unknown-unknown

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Materialize dependency source patches
        run: |
          command -v cargo-patch-crate >/dev/null 2>&1 ||
            cargo install --locked patch-crate
          cargo patch-crate --force

      - name: Install Trunk
        run: |
          command -v trunk >/dev/null 2>&1 ||
            cargo install --locked trunk --version 0.21.14

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install browser test dependencies
        run: npm ci --prefix web

      - name: Install Chromium and software WebGPU dependencies
        run: |
          npx --prefix web playwright install --with-deps chromium
          sudo apt-get install --yes --no-install-recommends \
            libvulkan1 \
            mesa-vulkan-drivers \
            xauth \
            xvfb

      - name: Build and test browser client
        working-directory: web
        env:
          PLAYWRIGHT_SOFTWARE_WEBGPU: '1'
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x1024x24' npm run test:e2e

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-e2e-failures
          path: web/test-results/
          if-no-files-found: ignore

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.mode }})
    needs: fmt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        mode: [default, silent, physical]

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install pinned Rust
        run: rustup toolchain install --no-self-update

      # The hosted Linux image ships ~20GB of toolchains this workspace never
      # touches. Reclaiming them before the cache unpacks is what keeps the test
      # build -- a restored ~2.2GB cache plus ~50 V8-linking test binaries --
      # inside the runner's disk; without it, codegen dies partway through with
      # `No space left on device`. `df` afterwards so the next squeeze is
      # diagnosable from the log alone.
      - name: Free runner disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libasound2-dev \
            libwebkit2gtk-4.1-dev

      # rust-cache prunes workspace-member artifacts (the statically-linked
      # test binaries that dominate target/) before saving; caching target/
      # wholesale grew past GitHub's 10GB repo cache cap and filled runner
      # disks mid-job. cache-bin (on by default) covers ~/.cargo/bin, so the
      # patch-crate install below persists across runs.
      - name: Cache Cargo data
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      # The workspace patches dependency sources via patch-crate (see patches/
      # and the workspace manifest): [patch.crates-io] points into target/patch/,
      # so cargo resolution fails until the patched crates are materialized.
      # --force rebuilds them from patches/*.patch even when a restored cache
      # carries a stale target/patch from an earlier commit.
      - name: Materialize dependency source patches
        shell: bash
        run: |
          command -v cargo-patch-crate >/dev/null 2>&1 ||
            cargo install --locked patch-crate
          cargo patch-crate --force

      - name: Audit Web Audio dependency and feature wiring
        run: python bin/check-web-audio-wiring.py

      - name: Test iced accessibility and editor focus patches
        if: matrix.mode == 'default'
        run: python bin/test-iced-accessibility-patches.py

      - name: Check hardware-free opt-out build
        if: matrix.mode == 'default'
        run: >-
          cargo check -p smudgy_ui --all-targets
          --no-default-features --locked

      - name: Check hosted silent Web Audio
        if: matrix.mode == 'silent'
        run: >-
          cargo check -p smudgy_ui --all-targets --no-default-features
          --features web-audio --locked

      - name: Check platform physical Web Audio
        if: matrix.mode == 'physical'
        # Compile only: hosted runners are not required to have a default device.
        # This selects WASAPI on Windows, ALSA on Linux, and CoreAudio on macOS.
        run: >-
          cargo check -p smudgy_ui --all-targets --no-default-features
          --features web-audio-cpal --locked

      - name: Test hardware-independent audio contracts
        if: matrix.mode == 'physical'
        run: |
          cargo test -p smudgy_audio --features physical-output --lib --locked --no-fail-fast
          cargo test -p smudgy_audio_web --lib --locked --no-fail-fast

      - name: Test hosted silent Web Audio integration
        if: matrix.mode != 'default'
        run: >-
          cargo test -p smudgy_core --no-default-features --features web-audio
          --test web_audio_integration --test package_isolates_sandbox --locked --no-fail-fast

      - name: Check workspace
        if: matrix.mode == 'default'
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Install browser target
        if: matrix.os == 'ubuntu-latest' && matrix.mode == 'default'
        run: rustup target add wasm32-unknown-unknown

      - name: Check browser client
        if: matrix.os == 'ubuntu-latest' && matrix.mode == 'default'
        run: cargo check -p smudgy_web_client --target wasm32-unknown-unknown --locked

      - name: Keep the desktop dependency graph browser-free
        if: matrix.os == 'ubuntu-latest' && matrix.mode == 'default'
        run: |
          if cargo tree -p smudgy_ui -e normal --locked | grep -Eq 'smudgy_(engine|web_client) v'; then
            echo 'Desktop unexpectedly links the browser client or portable engine' >&2
            exit 1
          fi

      - name: Test workspace
        if: matrix.mode == 'default'
        # This test reaches the real OS credential service, which is not a
        # deterministic dependency on headless hosted runners.
        run: >-
          cargo test --workspace --lib --tests --locked --no-fail-fast --
          --skip models::shared_packages::tests::missing_required_params_tracks_only_unset_required_keys
