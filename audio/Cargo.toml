[package]
name = "smudgy_audio"
version = "0.5.7-ptb.10"
edition = "2024"

[features]
# Unstable, nondefault cross-crate test ABI. Never enable in production builds.
test-support = []
# Direct proof-bearing system output. Kira's detached CPAL backend stays disabled.
physical-output = ["dep:cpal", "dep:rtrb"]

[dependencies]
futures = { workspace = true }
kira = { workspace = true }
cpal = { workspace = true, optional = true }
log = { workspace = true }
rtrb = { version = "0.3.5", optional = true }

[dev-dependencies]
assert_no_alloc = "1.1.2"

[lints]
workspace = true
